name: PHP 8.5 FPM

# nginx + PHP-FPM base image: HTTP :8080, non-root — Traefik/Laravel drop-in
# Variant builds (mongo/imagick/dev) disabled for now.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Log PHP base image version
        run: |
          docker pull php:8.5-fpm
          echo "Base image: php:8.5-fpm (+ nginx in Dockerfile)"
          docker run --rm php:8.5-fpm php -v

      -
        name: Build & Push - PHP8.5 Base FPM Image
        uses: docker/build-push-action@v6
        with:
          context: ./php8.5/base-fpm
          push: true
          pull: true
          tags: thekingscode/php8.5-base-fpm:latest
          sbom: true
          provenance: true
