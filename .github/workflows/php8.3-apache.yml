on:
  workflow_dispatch:
    # Auto triggers (push/schedule/workflow_run chain) disabled for now
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Log PHP base image version
        run: |
          docker pull php:8.3-apache
          echo "Base image: php:8.3-apache"
          docker run --rm php:8.3-apache php -v
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: ./php8.3-apache
          push: true
          pull: true
          tags: thekingscode/php8.3-apache:latest
