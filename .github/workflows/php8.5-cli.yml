name: PHP 8.5 CLI

# CLI base image for workers / artisan / CI — same extensions as FrankenPHP bases

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Log PHP base image version
        run: |
          docker pull php:8.5-cli
          echo "Base image: php:8.5-cli"
          docker run --rm php:8.5-cli php -v

      -
        name: Build & Push - PHP8.5 Base CLI Image
        uses: docker/build-push-action@v6
        with:
          context: ./php8.5/base-cli
          push: true
          pull: true
          tags: thekingscode/php8.5-base-cli:latest
          sbom: true
          provenance: true

      -
        name: Build & Push - PHP8.5 Base DEV CLI Image
        uses: docker/build-push-action@v6
        with:
          context: ./php8.5/base-cli
          push: true
          pull: true
          tags: thekingscode/php8.5-base-dev-cli:latest
          sbom: true
          provenance: true
          build-args: |
            "DEVELOPMENT=true"
